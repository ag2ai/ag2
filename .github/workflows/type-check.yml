name: Type check
# see: https://help.github.com/en/actions/reference/events-that-trigger-workflows
on: # Trigger the workflow on pull request or merge
  schedule:
    - cron: "0 0 * * *" # daily at midnight UTC
  workflow_dispatch: # allows manual triggering of the workflow
  # pull_request:
  # push:
  #   branches:
  #     - main

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref }}
  cancel-in-progress: true
permissions: {}

jobs:
  type-check:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        optional-dependencies:
          - "none"
          # LLMs
          - "openai"
          - "gemini"
          - "anthropic"
          - "deepseek"
          # optional dependencies
          - "browser-use"
          - "commsagent-discord"
          - "commsagent-slack"
          - "commsagent-telegram"
          - "jupyter-executor"
          - "retrievechat"
          - "retrievechat-pgvector"
          - "retrievechat-mongodb"
          - "retrievechat-qdrant"
          - "graph-rag-falkor-db"
          - "neo4j"
          - "interop"
          - "crawl4ai"
          - "docs"
          - "interop-langchain"
          - "interop-pydantic-ai"
          - "mcp"
          - "websockets"
        exclude:
          # Issues with installing retrievechat-qdrant in python 3.14
          - python-version: "3.14"
            optional-dependencies: "retrievechat-qdrant"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      # All additional modules should be defined in pyproject.toml
      - run: uv pip install --system --group types .
        if: matrix.optional-dependencies == 'none'
      - run: uv pip install --system --group types ".[${{ matrix.optional-dependencies }}]"
        if: matrix.optional-dependencies != 'none'
      # Any additional configuration should be defined in pyproject.toml
      - run: |
          mypy
